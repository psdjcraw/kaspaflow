<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KaspaFlow Offline</title>
    <meta name="theme-color" content="#167761" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8f3;
        --ink: #18201c;
        --muted: #647067;
        --line: #dfe4dc;
        --panel: #ffffff;
        --kaspa: #167761;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin: 0 auto;
        max-width: 440px;
        padding: 28px;
      }

      img {
        height: 54px;
        width: 54px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.1;
        margin: 18px 0 10px;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
        margin: 0;
      }

      a {
        background: var(--kaspa);
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        font-weight: 800;
        margin-top: 22px;
        padding: 12px 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>KaspaFlow is offline</h1>
      <p>Reconnect to refresh quotes, payments, and chain status.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
